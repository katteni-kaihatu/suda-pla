<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>レンダー画像の書き出しテスト</title>
  </head>
  <body>
    <main class="layout">
      <section class="preview">
        <div class="checker"><canvas id="output" width="320" height="480" aria-label="背景透過済みアバター画像"></canvas></div>
        <div class="caption"><span>PNG · 320 × 480</span><span>透明背景</span></div>
      </section>
      <section class="info">
        <p class="eyebrow">THREE.JS RENDER OUTPUT</p>
        <h1>画像だけを書き出す</h1>
        <p class="description">仮アバターを3Dでレンダリングし、グリーン背景を抜いたPNGです。メッシュやテクスチャのファイルは含みません。</p>
        <div class="details"><span>元画像</span><b>WebGLレンダー · 320 × 480 px</b><span>保存画像</span><b>PNG · アルファ付き</b></div>
        <button id="save" type="button">PNGを保存</button>
        <p id="status" role="status">画像を生成しています…</p>
        <a href="/" class="back">← kokoplaへ戻る</a>
      </section>
    </main>
    <script type="module" src="/src/avatar-image-test.js"></script>
  </body>
</html>
